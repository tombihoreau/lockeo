name: CI - Build & Push (backend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lockeo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lockeo_backend/package-lock.json

      - name: Install deps (backend)
        working-directory: lockeo_backend
        run: |
          npm ci
          npm run lint --if-present

      - name: Build (backend)
        working-directory: lockeo_backend
        run: |
          npm run build

      - name: Wait for DB (MySQL)
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -proot --silent; then
              echo "MySQL is up"; exit 0; fi; sleep 1; done; exit 1

      - name: Run migrations
        working-directory: lockeo_backend
        env:
          NODE_ENV: ci
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: lockeo_ci
          DB_SYNCHRONIZE: 'false'
          DB_DROP_SCHEMA: 'false'
        run: |
          npm run migration:run

      - name: Test (backend)
        working-directory: lockeo_backend
        env:
          NODE_ENV: ci
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: lockeo_ci
          DB_SYNCHRONIZE: 'false'
          DB_DROP_SCHEMA: 'false'
        run: |
          npm test --if-present -- --ci

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/lockeo-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./lockeo_backend
          file: ./lockeo_backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
